<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задачи и контроль исполнения — Единый портал</title>

    <script>
        (function () {
            try {
                const t = localStorage.getItem('theme');
                if (!t) return;
                if (t === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { }
        })();
    </script>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tasks.css" />
    <script src="js/layout.js" defer></script>
    <script src="js/tasks.js" defer></script>
</head>

<body>
    <main class="tasks-page">

        <div class="tasks-header">
            <h1 class="page-title">Задачи и контроль исполнения</h1>
            <button class="btn btn-primary" onclick="window.location='task-create.html'">
                + Создать задачу
            </button>
        </div>

        <!-- Отслеживание задач -->
        <section class="card task-tracking">
            <h2>Отслеживание состояния задачи и её выполнения</h2>

            <div class="tab-buttons">
                <button class="tab-btn active">В процессе</button>
                <button class="tab-btn">Выполнены</button>
                <button class="tab-btn">Просрочены</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Заголовок задачи</th>
                        <th>Отчёт</th>
                        <th>Ответственный</th>
                        <th>Срок выполнения</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 20px;">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- История решений -->
        <section class="card decision-history">
            <h2>История принятия решений и обратная связь</h2>
            <ul class="history-list">
                <li style="color: var(--text-light);">Загрузка...</li>
            </ul>
        </section>

    </main>
</body>

</html>
