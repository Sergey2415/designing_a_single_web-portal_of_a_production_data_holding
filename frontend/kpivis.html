<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KPI Детали — Единый портал</title>
    <script>
        (function () {
            try {
                const t = localStorage.getItem('theme'); // "light" | "dark" | "system" | null
                if (!t) return;
                if (t === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/kpivis.css" />
    <script src="js/layout.js" defer></script>
</head>

<body>
    <main>
        <h1 class="page-title">Детализация KPI</h1>

        <div class="breadcrumb">
            <a href="index.html">Главная</a> /
            <a href="kpi.html">KPI</a> /
            <span>Объём производства</span>
        </div>

        <section class="card kpi-details">
            <div class="kpi-stats">
                <div class="stat">
                    <span class="label">План</span>
                    <span class="value">—</span>
                </div>
                <div class="stat">
                    <span class="label">Фактически</span>
                    <span class="value">—</span>
                </div>
                <div class="stat">
                    <span class="label">Отклонение</span>
                    <span class="value positive">—</span>
                </div>
                <div class="stat">
                    <span class="label">Тренд</span>
                    <span class="value positive">—</span>
                </div>
            </div>
        </section>

        <section class="card table-section">
            <div class="tabs">
                <button class="tab active">По сменам</button>
                <button class="tab">По сотрудникам</button>
                <button class="tab">По оборудованию</button>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Смена</th>
                        <th>План</th>
                        <th>Факт</th>
                        <th>Отклонение</th>
                        <th>Тренд</th>
                    </tr>
                </thead>
                <tbody id="kpiVisTable">
                    <!-- Сюда подставятся данные -->
                    <tr>
                        <td>Смена 1</td>
                        <td>—</td>
                        <td>—</td>
                        <td class="positive">—</td>
                        <td class="positive">—</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>

</html>
